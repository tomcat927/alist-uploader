name: Build Windows

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: |
          npm install
          npm install @rollup/rollup-win32-x64-msvc @tauri-apps/cli-win32-x64-msvc --save-optional

      - name: Build frontend
        run: npm run build

      - name: Build Tauri App for Windows
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: npm run tauri

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: alist-uploader-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 30

      - name: Push to releases repository
        shell: bash
        run: |
          echo "📦 Preparing to push to releases repository..."
          
          # Configure git
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          
          # Clone releases repository
          rm -rf temp-release
          git clone https://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@github.com/tomcat927/alist-uploader-releases.git temp-release || {
            echo "Creating new releases repository..."
            mkdir -p temp-release
            cd temp-release
            git init
            git remote add origin https://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@github.com/tomcat927/alist-uploader-releases.git
            cd ..
          }
          
          cd temp-release
          
          # Remove old releases
          git rm -rf . || true
          
          # Copy new artifacts
          echo "📋 Copying build artifacts..."
          cp ../src-tauri/target/release/bundle/msi/*.msi . 2>/dev/null || echo "No MSI found"
          cp ../src-tauri/target/release/bundle/nsis/*.exe . 2>/dev/null || echo "No NSIS found"
          
          # Create DOWNLOADS.md
          echo "# Alist Uploader - Latest Releases" > DOWNLOADS.md
          echo "" >> DOWNLOADS.md
          echo "自动构建的最新版本，每次提交自动更新。" >> DOWNLOADS.md
          echo "" >> DOWNLOADS.md
          echo "## 下载" >> DOWNLOADS.md
          echo "" >> DOWNLOADS.md
          echo "- **MSI 安装包**: \`alist-uploader_*.msi\`" >> DOWNLOADS.md
          echo "- **EXE 安装包**: \`alist-uploader_*.exe\`" >> DOWNLOADS.md
          echo "" >> DOWNLOADS.md
          echo "## 版本信息" >> DOWNLOADS.md
          echo "" >> DOWNLOADS.md
          echo "- 构建时间：$(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> DOWNLOADS.md
          echo "- Commit: ${GITHUB_SHA}" >> DOWNLOADS.md
          echo "" >> DOWNLOADS.md
          echo "## 使用方式" >> DOWNLOADS.md
          echo "" >> DOWNLOADS.md
          echo "1. 下载安装包" >> DOWNLOADS.md
          echo "2. 双击运行安装" >> DOWNLOADS.md
          echo "3. 配置 Alist 账号密码" >> DOWNLOADS.md
          echo "4. 开始上传" >> DOWNLOADS.md
          
          # Commit and push
          git add -A
          git commit -m "🚀 Auto-release: Build from commit ${{ github.sha }}" || echo "No changes to commit"
          git push -f
          
          echo "✅ Successfully pushed to releases repository!"
          echo "📥 Download from: https://github.com/tomcat927/alist-uploader-releases"
