name: Build Windows

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}-${{ hashFiles('src-tauri/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install frontend dependencies
        run: npm ci

      - name: Restore Windows optional native packages
        run: npm install @rollup/rollup-win32-x64-msvc @tauri-apps/cli-win32-x64-msvc --no-save --include=optional

      - name: Build Tauri App for Windows
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: npm run tauri

      - name: Upload EXE to Release
        uses: ncipollo/release-action@v1
        with:
          tag: "latest"
          name: "最新构建"
          body: "每次 push 自动构建的最新版本。安装后打开软件，在设置页配置 Alist 账号信息即可使用。"
          replacesArtifacts: true
          allowUpdates: true
          removeArtifacts: true
          artifact: "src-tauri/target/release/bundle/nsis/*.exe"
          token: ${{ secrets.GITHUB_TOKEN }}
